<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Notes App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; color: #333; }
        h1 { text-align: center; color: #4A90E2; }
        .category { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .category h2 { margin-top: 0; color: #333; border-bottom: 2px solid #4A90E2; padding-bottom: 5px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; line-height: 1.5; }
    </style>
</head>
<body>

    <h1>📚 My Study Notes</h1>

    <div class="category">
        <h2>🔬 Science Notes</h2>
        <ul>
            <li><b>Photosynthesis:</b> Plants use sunlight, water, and CO2 to make food (Glucose).</li>
            <li><b>Newton's 1st Law:</b> An object will remain at rest unless acted upon by an external force.</li>
        </ul>
    </div>

    <div class="category">
        <h2>📐 Maths Formulas</h2>
        <ul>
            <li><b>Area of Circle:</b> A = &pi;r&sup2;</li>
            <li><b>Algebra:</b> (a + b)&sup2; = a&sup2; + 2ab + b&sup2;</li>
        </ul>
    </div>

</body>
</html>
