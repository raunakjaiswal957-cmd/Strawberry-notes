<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes Sharing App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📝 Notes Share Network</h1>
        <p>Apne notes upload karein aur dosto ke sath share karein!</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Naya Note Daalein</h2>
            <form id="notesForm">
                <input type="text" id="noteTitle" placeholder="Subject / Topic ka naam" required>
                <textarea id="noteDesc" placeholder="Note ke baare me thoda batayein..." rows="3" required></textarea>
                <input type="url" id="noteLink" placeholder="Google Drive ya PDF ka Link (https://...)" required>
                <button type="submit">Add Note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Saare Notes</h2>
            <div id="notesContainer" class="notes-grid">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
